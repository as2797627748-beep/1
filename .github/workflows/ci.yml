name: CI

on:
  push:
    branches:
      - main
      - '2604*-*'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Go tests
        run: go test ./...

      - name: Check frontend script syntax
        run: node --check internal/httpapi/web/app.js
